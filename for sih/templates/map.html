<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central University of Jammu Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #map { height: 600px; width: 100%; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto mt-10">
    <h1 class="text-3xl font-bold text-center text-blue-700 mb-6">
      🏫 Central University of Jammu
    </h1>

    <div id="map"></div>

    <div class="text-center mt-6">
      <a href="/dashboard"
         class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 shadow-md">
        ⬅ Back
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Base layers
    const normalMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' });
    const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri &mdash; Source: Esri, Maxar, Earthstar Geographics' });

    // Initialize map centered on CUJ
    const map = L.map('map', { center: [32.7265, 74.8570], zoom: 16, layers: [satelliteMap] });

    // Layer control
    L.control.layers({ "Satellite": satelliteMap, "Street Map": normalMap }).addTo(map);

    // CUJ marker
    // L.marker([32.7265, 74.8570]).addTo(map).bindPopup("📍 Central University of Jammu").openPopup();

    // Destination point function (500m away)
    function destinationPoint(lat, lng, distanceMeters, bearingDegrees) {
        const R = 6378137; // Earth radius in meters
        const δ = distanceMeters / R;
        const θ = bearingDegrees * Math.PI / 180;
        const φ1 = lat * Math.PI / 180;
        const λ1 = lng * Math.PI / 180;

        const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
        const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
        return [φ2 * 180 / Math.PI, λ2 * 180 / Math.PI];
    }

    // Locate user position
    map.locate({ setView: false, maxZoom: 18 });

    function onLocationFound(e) {
      const radius = e.accuracy;
      const userLatLng = e.latlng;

      // Marker for actual user location
      L.marker(userLatLng).addTo(map).bindPopup(`📍 Your Location (accuracy ±${radius.toFixed(0)} m)`).openPopup();
      L.circle(userLatLng, radius, {color: 'blue', fillColor: '#30f', fillOpacity: 0.2}).addTo(map);

      // Marker 500m away to the north (bearing 0°)
      const secondPoint = destinationPoint(userLatLng.lat, userLatLng.lng, 500, 0);
      L.marker(secondPoint, {icon: L.icon({iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', iconSize: [30, 30]})})
        .addTo(map)
        .bindPopup("📍 500 meters from your location (north)");
    }

    function onLocationError(e) { console.warn("⚠️ Could not get your location. Please allow location access."); }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);
  </script>
</body>
</html>
